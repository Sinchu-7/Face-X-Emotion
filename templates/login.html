<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in | Face-X-Emotion</title>
    <style>
        :root { color-scheme: light; font-family: Inter, "Segoe UI", Arial, sans-serif; color: #172033; background: #f3f6fb; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 20% 20%, #e0eaff, transparent 38%), #f3f6fb; }
        .card { width: min(100%, 430px); padding: 38px; border: 1px solid #e4e9f2; border-radius: 22px; background: #fff; box-shadow: 0 24px 70px #26395b18; }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; color: #3859d7; font-weight: 750; letter-spacing: -.02em; }
        .brand-mark { display: grid; width: 42px; height: 42px; place-items: center; border-radius: 13px; background: #eef1ff; font-size: 22px; }
        h1 { margin: 0 0 8px; font-size: clamp(26px, 6vw, 32px); letter-spacing: -.04em; }
        .intro { margin: 0 0 26px; color: #667085; line-height: 1.55; }
        label { display: block; margin: 18px 0 7px; color: #344054; font-size: 14px; font-weight: 650; }
        input { width: 100%; padding: 13px 14px; border: 1px solid #d6dce8; border-radius: 10px; outline: none; font: inherit; }
        input:focus { border-color: #536fe0; box-shadow: 0 0 0 3px #536fe022; }
        button { width: 100%; margin-top: 24px; padding: 14px; border: 0; border-radius: 10px; background: #3859d7; color: white; font: inherit; font-weight: 700; cursor: pointer; }
        button:hover { background: #2e49ba; }
        .error { margin: 0 0 18px; padding: 12px 14px; border-radius: 10px; background: #fff0ef; color: #a52c25; font-size: 14px; line-height: 1.45; }
        .note { margin: 22px 0 0; color: #7a8497; font-size: 12px; line-height: 1.5; text-align: center; }
        @media (max-width: 480px) { .card { padding: 28px 22px; } }
    </style>
</head>
<body>
    <main class="card">
        <div class="brand"><span class="brand-mark" aria-hidden="true">☺</span><span>Face-X-Emotion</span></div>
        <h1>Welcome back</h1>
        <p class="intro">Sign in to open the facial-expression analysis workspace.</p>
        {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
        <form action="{{ url_for('login') }}" method="post">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" autocomplete="username" required>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
            <button type="submit">Sign in</button>
        </form>
        <p class="note">Local educational demo. Emotion estimates are not a measure of a person's internal state.</p>
    </main>
</body>
</html>
